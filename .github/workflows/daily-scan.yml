name: daily-scan

on:
  schedule:
    - cron: "15 22 * * 1-5"    # 22:15 UTC Mon-Fri — after US close
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy lxml

      - name: Swing scan (stocks)
        run: |
          mkdir -p docs
          set -o pipefail
          {
            python scanner.py --html docs/index.html &&
            python stock_scanner.py --universe all --html docs/stocks.html \
              --portfolio-html docs/portfolio.html \
              --portfolio-txt docs/portfolio_digest.txt
          } 2>&1 | tee docs/run.log

      - name: Publish
        if: always()
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs state
          git commit -m "scan $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull --rebase -X ours || true
          git push

      - name: Build swing digest
        id: d
        run: python make_digest.py                    # writes digest.md (swing) + title

      - name: Email the swing sheet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[Swing] ${{ steps.d.outputs.title }}" --body-file digest.md
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --search "[Swing] in:title" --json number --jq '.[].number' \
            | tail -n +4 | xargs -r -I{} gh issue close {} --repo "$GITHUB_REPOSITORY"
